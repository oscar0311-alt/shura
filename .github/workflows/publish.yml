# 매일 밤 9시(한국 시간)에 approved 게시물 하나를 인스타그램에 올린다.
name: daily-publish
on:
  schedule:
    - cron: "7 12 * * *"   # UTC 12:07 = 한국 21:07
  workflow_dispatch: {}     # Actions 탭에서 수동 실행 가능
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python publish.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          IG_POST_AS: image
      - name: 게시 기록 저장
        run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || git commit -m "publish: $(date -u +%F)" && git push
